; Common settings shared by every environment below. Each board profile
; (dev/prod) adds -DKISLAP_PROFILE_* to build_flags to select its LED
; chipset/color order/hostname in src/config.h.
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=5
lib_deps =
    FastLED
    bblanchon/ArduinoJson@^7.0

; --- Dev board: WS2815/GRB strand -------------------------------------------
[env:esp32dev]
build_flags =
    ${env.build_flags}
    -DKISLAP_PROFILE_DEV



[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
; The board's IP on your network (see the serial monitor at boot).
; Using the IP directly avoids relying on mDNS (.local) resolution.
upload_port = 192.168.68.179



; --- Prod board: WS2811_400/RGB strand (house LEDs) -------------------------
[env:esp32prod]
build_flags =
    ${env.build_flags}
    -DKISLAP_PROFILE_PROD

[env:esp32prod-ota]
extends = env:esp32prod
upload_protocol = espota
upload_port = 192.168.68.180
